<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - صدقة جارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f1ea;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --quran-text: #1b4332;
            --accent-color: #2d6a4f;
            --border-color: #d8d2c2;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --quran-text: #52b788;
            --accent-color: #40916c;
            --border-color: #333333;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button, select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .surah-select-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .quran-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            min-height: 400px;
        }

        .verse-box {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 24px;
            line-height: 2.2;
            color: var(--quran-text);
            text-align: right;
            margin-bottom: 10px;
        }

        .verse-number {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            font-size: 14px;
            margin-left: 8px;
        }
      .tafsir-text {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
            padding: 8px;
            background: rgba(0,0,0,0.02);
            border-radius: 4px;
            display: none;
        }

        .audio-player {
            width: 100%;
            margin-top: 10px;
            height: 35px;
        }

        .action-btn {
            font-size: 12px;
            margin-top: 5px;
            background: transparent;
            color: var(--accent-color);
            border: none;
            padding: 0;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 المصحف الإلكتروني</h1>
        <div class="controls">
            <button id="themeToggle">🌙 الوضع الليلى</button>
            <div>
                <button onclick="changeFontSize(2)">A+</button>
                <button onclick="changeFontSize(-2)">A-</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="surah-select-box">
            <label for="surahList">اختر السورة:</label>
            <select id="surahList" onchange="loadSurah(this.value)">
                <!-- سيتم تحميل السور هنا -->
            </select>
            
            <label for="reciterList">القارئ:</label>
            <select id="reciterList" onchange="loadSurah(document.getElementById('surahList').value)">
                <option value="ar.alafasy">مشاري العفاسي</option>
                <option value="ar.abdulbasitmurattal">عبد الباسط عبد الصمد (مرتل)</option>
                <option value="ar.minshawi">محمد صديق المنشاوي</option>
            </select>
        </div>

        <div class="quran-container" id="quranContainer">
            <p style="text-align: center;">جاري تحميل السورة...</p>
        </div>
    </div>

    <script>
        let currentFontSize = 24;

        // 1. جلب قائمة السور عند تحميل الصفحة
        async function fetchSurahs() {
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                const surahSelect = document.getElementById('surahList');
                
                data.data.forEach(surah => {
                    let option = document.createElement('option');
                    option.value = surah.number;
                    option.textContent = `${surah.number}. ${surah.name}`;
                    surahSelect.appendChild(option);
                });

                // استرجاع آخر سورة قرأها المستخدم من الـ LocalStorage
                const savedSurah = localStorage.getItem('lastSurah') || 1;
                surahSelect.value = savedSurah;
                loadSurah(savedSurah);
            } catch (error) {
                console.error("خطأ في تحميل قائمة السور:", error);
            }
        }

        // 2. تحميل نص السورة والتلاوة والتفسير
        async function loadSurah(surahNumber) {
            const container = document.getElementById('quranContainer');
            const reciter = document.getElementById('reciterList').value;
            container.innerHTML = '<p style="text-align: center;">جاري التحميل...</p>';
            
            // حفظ موضع القراءة
            localStorage.setItem('lastSurah', surahNumber);

            try {
                // طلب البيانات (النص، التلاوة، وتفسير الميسر)
                const [textRes, audioRes, tafsirRes] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${reciter}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/ar.muyassar`)
                ]);

                const textData = await textRes.json();
                const audioData = await audioRes.json();
                const tafsirData = await tafsirRes.json();

                container.innerHTML = '';

                textData.data.ayahs.forEach((ayah, index) => {
                    const verseDiv = document.createElement('div');
                    verseDiv.className = 'verse-box';

                    const audioUrl = audioData.data.ayahs[index].audio;
                    const tafsirText = tafsirData.data.ayahs[index].text;

                    verseDiv.innerHTML = `
                        <div class="arabic-text" style="font-size: ${currentFontSize}px;">
                            ${ayah.text} <span class="verse-number">${ayah.numberInSurah}</span>
                        </div>
                        <audio class="audio-player" controls preload="none">
                            <source src="${audioUrl}" type="audio/mp3">
                        </audio>
                        <div>
                            <button class="action-btn" onclick="toggleTafsir(${index})">عرض التفسير</button>
                            <div class="tafsir-text" id="tafsir-${index}">${tafsirText}</div>
                        </div>
                    `;
                    container.appendChild(verseDiv);
                });

            } catch (error) {
                container.innerHTML = '<p style="text-align: center; color: red;">حدث خطأ أثناء تحميل السورة.</p>';
            }
        }

        // 3. التبديل بين التفسير وإخفائه
        function toggleTafsir(index) {
            const el = document.getElementById(`tafsir-${index}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        // 4. تغيير حجم الخط
        function changeFontSize(delta) {
            currentFontSize += delta;
            document.querySelectorAll('.arabic-text').forEach(el => {
                el.style.fontSize = `${currentFontSize}px`;
            });
        }

        // 5. التبديل بين الوضع الليلي والعادي
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.body.removeAttribute('data-theme');
                themeBtn.textContent = '🌙 الوضع الليلى';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️ الوضع النهاري';
            }
        });

        // تشغيل التطبيق
        fetchSurahs();
    </script>
</body>
</html>
